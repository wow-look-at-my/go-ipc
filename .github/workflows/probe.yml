name: probe
on:
  push:
    branches: ['probe/**']
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: wow-look-at-my/go-shm
          path: deps/go-shm
      - uses: actions/checkout@v4
        with:
          repository: wow-look-at-my/go-mmap
          path: deps/go-mmap
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go mod edit -replace github.com/wow-look-at-my/go-shm=./deps/go-shm -replace github.com/wow-look-at-my/go-mmap=./deps/go-mmap
      - run: go mod tidy
      - run: go test -count=1 -timeout 15m -v ./...
