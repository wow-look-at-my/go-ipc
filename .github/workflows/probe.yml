name: probe
on:
  push:
    branches: ['probe/**']
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go get github.com/wow-look-at-my/go-shm@master github.com/wow-look-at-my/go-mmap@master
      - run: go test -count=1 -timeout 15m -v ./...
