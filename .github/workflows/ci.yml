name: CI

on:
  push:
    branches: ['**']

permissions:
  id-token: write
  contents: write
  actions: read
  checks: read
  deployments: write
  artifact-metadata: write

jobs:
  # The root go-toolchain run also covers interop/ and codegen/go. Linux builds and tests the C, C++ and Python implementations and their peers first, macOS the C and Python ones, and Windows runs the interop matrix with the Go peer alone.
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # go-toolchain submits a dependency snapshot in CI and needs a token for it.
      GITHUB_TOKEN: ${{ github.token }}
      GOIPC_SPEC_DIR: ${{ github.workspace }}/spec
      GOIPC_LIBRARY: ${{ github.workspace }}/c/build/libgoipc.so
      GOIPC_PEER_C: ${{ github.workspace }}/c/build/goipc-peer
      GOIPC_PEER_CPP: ${{ github.workspace }}/cpp/build/goipc-peer
      GOIPC_PEER_PY: python3 -m goipc.peer
      PYTHONPATH: ${{ github.workspace }}/python:${{ github.workspace }}/build/gen/py
      GOIPC_INTEROP_LANGS: ${{ matrix.os == 'ubuntu-latest' && 'go,c,cpp,py' || matrix.os == 'macos-latest' && 'go,c,py' || 'go' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      # The C, C++ and Python generated code comes from ipcgen, so it builds first. The Go modules generate their own code with go:generate on every host.
      - if: runner.os != 'Windows'
        uses: wow-look-at-my/go-toolchain@master
        with:
          working-directory: ipcgen
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtest-dev jq
      - if: runner.os == 'Linux'
        run: pipx install uv
      # The sanitizer builds of the C suite use Homebrew's llvm on macOS, because Apple's clang has no leak detector.
      - if: runner.os == 'macOS'
        run: brew install llvm uv
      - if: runner.os != 'Windows'
        run: make -C python interpreters
      - if: runner.os == 'Linux'
        run: make native
      - if: runner.os == 'macOS'
        run: make test-c test-py test-codegen
      - uses: wow-look-at-my/go-toolchain@master
